plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.notesmvp.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.notesmvp.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    // Signing: the release key comes only from environment variables set by CI from GitHub Secrets.
    // The old debug.keystore file is public and is intentionally no longer used.
    // Without a private key, the APK is signed with the build machine's own throwaway debug key
    // (for testing only: a later build cannot update it).
    def relStore = System.getenv("KEYSTORE_PATH")
    if (relStore) {
        signingConfigs {
            release {
                storeFile file(relStore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig relStore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
