name: Build and test APK

on:
  push:
    branches: [ main, master, 'fix/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: exrackt gopi note
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Load private release key (only when the secrets exist)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon

      - name: Verify signature is not the public key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee cert.txt
          if grep -qi 'SHA-256 digest: 9d55798392e0' cert.txt; then
            echo "APK is signed with the public debug key"; exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          if [ "$HAS_KEY" = "true" ]; then N=NotesMVP-release.apk; else N=NotesMVP-test.apk; fi
          cp app/build/outputs/apk/release/app-release.apk "out/$N"

      - uses: actions/upload-artifact@v4
        with:
          name: NotesMVP-apk
          path: exrackt gopi note/out/*.apk
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [ 34, 36 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NotesMVP-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 .github/scripts/guest_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api${{ matrix.api }}
          path: screenshots
